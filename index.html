<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamestown: Conflicts, Cooperation, and Costs (1607–1612)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* ============================================================
   JAMESTOWN: CONFLICTS, COOPERATION, AND COSTS (1607–1612) · EDUTOPIA DESIGN SYSTEM
   Same layout as Class Jobs Maker and "Authentic or AI?", recolored
   to look like an old colonial map: parchment background, slab
   headlines in sea blue, a charcoal top bar with gold trim, and
   light parchment cards. Deep red stays rare:
   one word in the title and one main button per screen.
   Layout: two panels that fill the page. Picture and colony numbers
   on the left, the story and choices on the right. One column on phones.
   ============================================================ */
:root{
  color-scheme: light;
  /* Colonial map palette: parchment, charcoal, old gold, sea blue, deep red.
     The token names stay the same so every part of the page picks up the new colors. */
  --edu-orange:#9E1B1B; --edu-dark-orange:#B3412A; --edu-tangerine:#C29A45; --edu-sunshine:#D8B661;
  --edu-midnight:#2B2824; --edu-space:#2F5568; --edu-pacific:#3E6F88; --edu-tech:#8DB3C4;
  --edu-purple:#6B4A2E; --edu-light-purple:#A98457; --edu-pink:#8E3B2E; --edu-salmon:#C46A55;
  --edu-teal:#5F7A3A; --edu-light-teal:#9FAE6E; --edu-green:#5E7F2E; --edu-light-green:#C3CB86;
  --edu-dark-grey:#3A342C; --edu-light-grey:#665C4E; --edu-cream:#EDE2C2; --edu-white:#FBF6E7;
  --edu-charcoal:#2E2D2B; --edu-gold:#C29A45; --edu-parchment-text:#F2E7C4;
  /* soft tints of the palette, for backgrounds behind dark text */
  --tint-blue:#D3E1E4; --tint-teal:#E0E2C3; --tint-purple:#E9DBC4; --tint-sun:#F0DDA4; --tint-pink:#EBD2C6; --tint-green:#E1E5BE;
  --line:#D6C69B; --track:#DCCFAB; --warn:#8E1A1A;
  --font-ui:'Poppins',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-slab:'Museo Slab','Zilla Slab',Rockwell,Georgia,serif;
  --shadow-card:0 4px 20px rgba(46,36,22,.12);
  --shadow-pop:0 10px 40px rgba(46,36,22,.22);
  --radius:18px;
  --page-w:1560px; --gutter:clamp(16px,2.6vw,40px);
  --you:var(--edu-pacific); --real:var(--edu-salmon); /* chart colors: checked for color-blind safety */
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:var(--font-ui);font-size:17px;line-height:1.6;color:var(--edu-midnight);-webkit-font-smoothing:antialiased;
  background:var(--edu-cream)}
h1,h2,h3{font-family:var(--font-slab);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;color:var(--edu-midnight)}
p{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--edu-pacific);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

/* ---------- Top bar ---------- */
.appbar{position:relative;background:var(--edu-charcoal);color:var(--edu-parchment-text);box-shadow:0 2px 12px rgba(46,36,22,.10);margin-bottom:6px}
.appbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px;
  background:linear-gradient(var(--edu-gold) 0 4px,var(--edu-orange) 0)}
.appbar .in{max-width:var(--page-w);margin-inline:auto;padding-inline:var(--gutter);padding-block:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px}
.appbar .name{color:var(--edu-parchment-text);font-family:var(--font-slab);font-weight:700;font-size:22px;line-height:1.1}
.appbar .when{color:var(--edu-midnight);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--tint-blue);border-radius:99px;padding:5px 14px;white-space:nowrap}

.wrap{max-width:var(--page-w);margin-inline:auto;padding-inline:var(--gutter);padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:clamp(18px,2.4vw,36px);align-items:start}
.left{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .left{position:static}
}

/* ---------- Status card ---------- */
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px 22px;align-items:end;background:var(--edu-white);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:14px 20px 16px}
.people{grid-column:1 / -1;display:flex;flex-direction:row;align-items:baseline;gap:8px;line-height:1.05}
.people b{font-family:var(--font-ui);font-weight:800;font-size:32px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.people span{font-size:14px;color:var(--edu-light-grey)}
.meter{min-width:0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:14px;margin-bottom:4px}
.meter .top b{font-weight:700}
.meter .top i{font-style:normal;font-weight:600;font-variant-numeric:tabular-nums;color:var(--edu-light-grey)}
.meter .track{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.meter .fill{height:100%;width:50%;border-radius:99px;transition:width .6s ease}
.meter[data-k="food"] .fill{background:var(--edu-sunshine)}
.meter[data-k="health"] .fill{background:var(--edu-green)}
.meter[data-k="trust"] .fill{background:var(--edu-pacific)}
.meter[data-k="company"] .fill{background:var(--edu-purple)}
.meter .low{display:none;font-size:12px;font-weight:700;color:var(--warn)}
.meter.is-low .low{display:inline}

/* ---------- Picture ---------- */
.plate{margin:0;background:var(--edu-white);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden}
.plate svg{display:block;width:100%;height:auto;max-width:100%}
.plate figcaption{font-size:13.5px;color:var(--edu-light-grey);padding:9px 18px 10px}
.plate .photo{display:block;width:100%;height:auto;max-height:min(68vh,640px);object-fit:contain;background:var(--edu-cream)}
.plate figcaption .credit{display:block;font-size:12px;margin-top:3px;opacity:.85}
.story{font-size:18px;line-height:1.65}
.story b,.cast b{color:var(--edu-space)}
.cast{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cast li{background:var(--edu-white);border-radius:14px;box-shadow:var(--shadow-card);padding:10px 16px;font-size:16px;line-height:1.5;display:flex;gap:14px;align-items:center}
.cast .face{flex:0 0 auto;width:72px;height:86px;border-radius:12px;object-fit:cover;object-position:50% 20%;background:var(--edu-cream)}
.cast .face.none{display:grid;place-items:center;font-family:var(--font-slab);font-weight:700;font-size:24px;color:var(--edu-space);background:var(--tint-blue)}
.cast .credit{display:block;font-size:12px;color:var(--edu-light-grey);margin-top:2px}
.dots{display:flex;gap:8px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--track)}
.dots span.past{background:var(--edu-light-teal)}
.dots span.on{background:var(--edu-pacific);width:28px;border-radius:99px}

/* ---------- Text blocks ---------- */
.stage{display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{align-self:flex-start;font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:var(--edu-sunshine);padding:6px 18px;border-radius:99px}
.round-title{font-size:clamp(30px,4.4vw,42px)}
.hero{font-size:clamp(46px,9vw,88px);line-height:1.02;color:var(--edu-pacific)}
.hero .hl{color:var(--edu-orange)}
.hero .hero-yrs{display:block;font-size:.45em;margin-top:.2em}
.lede{font-size:clamp(18px,2.2vw,22px);line-height:1.5;color:var(--edu-dark-grey);max-width:44rem}
.prose{display:flex;flex-direction:column;gap:10px;max-width:42rem}
.news{background:var(--tint-sun);border-radius:16px;padding:14px 20px}
.news b{font-family:var(--font-slab);font-weight:700;font-size:21px;display:block;margin-bottom:2px}
.other{background:var(--tint-teal);border-radius:16px;padding:14px 20px}
.other b{display:block;font-family:var(--font-slab);font-weight:700;font-size:19px;color:var(--edu-space);margin-bottom:2px}

/* ---------- Advisors ---------- */
.advice{display:flex;flex-direction:column;gap:10px}
.advice h3{font-size:21px}
.advice .who{display:flex;flex-wrap:wrap;gap:8px}
.advice .who button{font-weight:700;font-size:14px;line-height:1.2;background:var(--edu-white);border:2.5px solid var(--edu-midnight);border-radius:99px;padding:8px 18px;transition:background .12s,color .12s,transform .12s}
.advice .who button:hover{transform:translateY(-2px)}
.advice .who button[aria-pressed="true"]{background:var(--edu-midnight);color:var(--edu-white)}
.advice blockquote{margin:0;padding:14px 20px;background:var(--tint-blue);border-radius:16px;font-size:18px;font-weight:500;line-height:1.5}
.advice blockquote cite{display:block;font-style:normal;font-weight:400;font-size:13.5px;color:var(--edu-light-grey);margin-top:4px}

/* ---------- Choices ---------- */
.choices{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:center;text-align:left;background:var(--edu-white);border:2.5px solid transparent;border-radius:var(--radius);box-shadow:var(--shadow-card);padding:14px 20px 14px 14px;transition:transform .12s,box-shadow .12s,border-color .12s}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop);border-color:var(--edu-pacific)}
.choice:active{transform:none}
.choice .ltr{grid-row:1 / span 2;font-family:var(--font-slab);font-weight:700;font-size:24px;line-height:1;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--edu-sunshine);color:var(--edu-midnight)}
.choice:nth-child(2) .ltr{background:var(--edu-tech)}
.choice:nth-child(3) .ltr{background:var(--edu-light-green)}
.choice b{font-size:18px;font-weight:700;line-height:1.3;align-self:end}
.choice .more{color:var(--edu-light-grey);font-size:14.5px;line-height:1.45;align-self:start}

/* ---------- Results ---------- */
.result{background:var(--edu-white);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:24px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{border-radius:99px;padding:4px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.chips li.up{background:var(--tint-green)}
.chips li.down{background:var(--tint-pink)}
.chips li.dead{background:var(--edu-midnight);color:var(--edu-white)}
.real{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.real h3{font-size:22px;color:var(--edu-pacific)}
.over{background:var(--edu-midnight);color:var(--edu-white);border-radius:16px;padding:14px 20px}
.over b{display:block;font-family:var(--font-slab);font-weight:700;font-size:22px}
.word{background:var(--tint-purple);border-radius:14px;padding:10px 16px;font-size:15px}
.go{align-self:flex-start;font-weight:700;font-size:18px;line-height:1.2;border-radius:99px;padding:13px 34px;background:var(--edu-orange);color:var(--edu-white);border:2.5px solid var(--edu-orange);transition:transform .12s,box-shadow .12s,background .12s,color .12s}
.go:hover{background:#7F1414;border-color:#7F1414;transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.go:active{transform:none}
.go.quiet{background:var(--edu-white);color:var(--edu-midnight);border-color:var(--edu-midnight);font-size:15px;padding:11px 24px}
.go.quiet:hover{background:var(--edu-midnight);color:var(--edu-white);border-color:var(--edu-midnight)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- Clickable report cards ---------- */
.cmp[data-real]{cursor:pointer;transition:transform .12s,box-shadow .12s}
.cmp[data-real]:hover{transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.cmp-more{display:block;margin-top:8px;font-size:13.5px;font-weight:700;color:var(--edu-pacific)}
@media print{.cmp-more{display:none}}

/* ---------- Sound button ---------- */
.bar-r{display:flex;align-items:center;gap:10px}
.sound{font:inherit;font-size:13px;font-weight:700;color:var(--edu-midnight);background:var(--edu-white);border:2px solid var(--line);border-radius:99px;padding:4px 12px 4px 30px;position:relative;cursor:pointer}
.sound::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--edu-green)}
.sound[aria-pressed="false"]::before{background:var(--track)}
.sound:hover{border-color:var(--edu-midnight)}
@media print{.sound{display:none}}

/* ---------- The movie clip ---------- */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.plate .video{position:relative;aspect-ratio:16/9;background:var(--edu-midnight)}
.plate .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.plate figcaption a,.cliplink a{color:var(--edu-pacific);font-weight:600}
.nw{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:14px;width:100%}
@media (max-width:640px){.nw{grid-template-columns:minmax(0,1fr)}}
.nwcard,.qcard{background:var(--edu-white);border-radius:18px;box-shadow:var(--shadow-card);padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.nwcard .badge,.qcard .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-slab);font-weight:700;font-size:22px;color:var(--edu-midnight);flex:0 0 auto}
.nwcard h3,.qcard h3{font-size:22px;color:var(--edu-pacific)}
.nwcard p,.qcard p{margin:0;font-size:15.5px;line-height:1.5}
.qhead{display:flex;align-items:center;gap:12px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:12px;width:100%}
.note{font:inherit;font-size:15.5px;color:var(--edu-midnight);background:var(--edu-cream);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-height:72px;resize:vertical;width:100%;box-sizing:border-box}
.note:focus{outline:none;border-color:var(--edu-pacific)}
.cliplink{font-size:14px;color:var(--edu-light-grey);margin:0}
.clipnotes{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.clipnotes li{background:var(--edu-white);border-radius:14px;box-shadow:var(--shadow-card);padding:10px 16px;font-size:15.5px;line-height:1.5}
.clipnotes li b{display:block;color:var(--edu-space);font-size:14px}

/* ---------- Welcome ---------- */
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;margin:0;padding:0;list-style:none;text-align:left}
.howto li{background:var(--edu-white);border-radius:16px;box-shadow:var(--shadow-card);padding:12px 16px 14px;font-size:14px;line-height:1.45;color:var(--edu-light-grey)}
.howto li b{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--edu-midnight)}
.howto li b::before{content:"";width:16px;height:16px;border-radius:50%;flex:0 0 auto;background:var(--edu-sunshine)}
.howto li[data-k="health"] b::before{background:var(--edu-green)}
.howto li[data-k="trust"] b::before{background:var(--edu-pacific)}
.howto li[data-k="company"] b::before{background:var(--edu-purple)}
@media (max-width:1280px){.howto{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:22rem;text-align:left}
.field label{font-size:14px;font-weight:700}
.field input{font:inherit;color:var(--edu-midnight);background:var(--edu-white);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px}
.field input:focus{outline:none;border-color:var(--edu-pacific)}
.welcome .go{font-size:20px;padding:14px 44px}
.fine{font-size:13.5px;line-height:1.55;color:var(--edu-light-grey);max-width:42rem}

/* ---------- Report ---------- */
.report-head{font-size:clamp(36px,6vw,60px);color:var(--edu-pacific)}
.section{font-size:24px;margin-top:6px}
.bignum{display:flex;flex-wrap:wrap;gap:8px 32px;align-items:baseline}
.bignum div{display:flex;flex-direction:column;line-height:1.1}
.bignum b{font-family:var(--font-ui);font-weight:800;font-size:52px;letter-spacing:-.02em;color:var(--edu-pacific);font-variant-numeric:tabular-nums}
.bignum span{font-size:14px;color:var(--edu-light-grey)}
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:14px;margin:0;padding:0;list-style:none}
.verdicts li{background:var(--edu-white);border-radius:16px;box-shadow:var(--shadow-card);border-top:8px solid var(--edu-pink);padding:12px 18px 16px;font-size:15.5px}
.verdicts li:nth-child(2){border-top-color:var(--edu-light-teal)}
.verdicts li:nth-child(3){border-top-color:var(--edu-sunshine)}
.verdicts li b{display:block;font-family:var(--font-slab);font-weight:700;font-size:22px}
.timeline{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:44rem}
.timeline li{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:12px;align-items:baseline}
.timeline li b{font-family:var(--font-ui);font-weight:800;font-size:18px;color:var(--edu-space);font-variant-numeric:tabular-nums}
.think{margin:0;padding-left:1.3rem;display:grid;gap:8px;max-width:44rem}
.copied{font-size:14px;color:var(--edu-space);font-weight:700}
.copybox{width:100%;min-height:9rem;font:inherit;font-size:14px;border:2.5px solid var(--line);border-radius:14px;padding:10px;background:var(--edu-white);color:var(--edu-midnight)}

/* The final report uses the whole page: picture and numbers across the top, report below. */
body.is-report .wrap{grid-template-columns:minmax(0,1fr)}
body.is-report .left{position:static;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(18px,2.4vw,36px)}
@media (min-width:1000px){body.is-report .cmp-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){body.is-report .left{grid-template-columns:minmax(0,1fr)}}

/* ---------- Check the Charter, and source buttons ---------- */
.charter-btn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:center;text-align:left;background:var(--tint-sun);border:2.5px solid transparent;border-radius:var(--radius);padding:12px 20px 12px 14px;transition:transform .12s,box-shadow .12s,border-color .12s}
.charter-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);border-color:var(--edu-sunshine)}
.charter-btn svg{grid-row:1 / span 2;width:48px;height:48px;display:block}
.charter-btn b{font-size:18px;line-height:1.3;align-self:end}
.charter-btn .more{color:var(--edu-dark-grey);font-size:14.5px;line-height:1.45;align-self:start}
.evidence{display:flex;flex-direction:column;gap:8px}
.evidence > b{font-size:14px}
.srclist{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.srcbtn{display:inline-flex;align-items:center;gap:8px;text-align:left;font-weight:600;font-size:14.5px;line-height:1.3;background:var(--tint-blue);border:2.5px solid transparent;border-radius:99px;padding:6px 16px 6px 6px;transition:background .12s,color .12s,border-color .12s}
.srcbtn:hover{border-color:var(--edu-pacific)}
.tag{flex:0 0 auto;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--edu-white);border-radius:99px;padding:3px 10px;white-space:nowrap}
.library{display:grid;gap:14px}
.library h4{font-family:var(--font-ui);font-size:14px;font-weight:700;margin:0 0 6px;color:var(--edu-dark-grey)}

/* ---------- Pop-up ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);background:rgba(46,36,22,.62)}
.sheet{position:relative;width:min(100%,54rem);max-height:100%;overflow-y:auto;background:var(--edu-white);border-radius:22px;box-shadow:var(--shadow-pop);padding:26px clamp(18px,3vw,34px) 28px}
.sheet:focus{outline:none}
.sheet .x{position:sticky;top:0;display:block;margin:-6px -6px -34px auto;font-weight:700;font-size:14px;background:var(--edu-white);border:2.5px solid var(--edu-midnight);border-radius:99px;padding:6px 16px;z-index:2}
.sheet .x:hover{background:var(--edu-midnight);color:var(--edu-white)}
.m-body{display:flex;flex-direction:column;gap:14px}
.m-body h2{font-size:clamp(26px,3.4vw,36px);color:var(--edu-pacific)}
.m-meta{font-size:14.5px;color:var(--edu-light-grey);line-height:1.5}
.m-meta b{color:var(--edu-midnight)}
.m-img{margin:0;background:var(--edu-cream);border-radius:14px;padding:10px;text-align:center}
.m-img img{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;margin-inline:auto;border-radius:6px}
.m-img.tall img{max-height:70vh}
.m-img.short img{max-height:38vh}
.m-img figcaption{font-size:12.5px;color:var(--edu-light-grey);margin-top:6px}
.m-label{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--edu-dark-grey);display:block;margin-bottom:4px}
.m-quote{margin:0;background:var(--tint-sun);border-radius:16px;padding:14px 20px}
.m-quote p{font-family:var(--font-slab);font-weight:600;font-size:clamp(18px,2vw,21px);line-height:1.45}
.m-quote p + p{margin-top:10px}
.m-quote mark{background:var(--edu-sunshine);color:inherit;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.m-quote ul{margin:0;padding-left:1.2rem;font-family:var(--font-slab);font-weight:600;font-size:19px;line-height:1.5}
.m-plain{background:var(--tint-green);border-radius:16px;padding:14px 20px}
.m-look{background:var(--tint-blue);border-radius:16px;padding:14px 20px}
.m-words{font-size:14.5px;color:var(--edu-dark-grey)}
.m-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.m-foot a{display:inline-block;font-weight:700;font-size:15px;line-height:1.2;text-decoration:none;color:var(--edu-midnight);background:var(--edu-white);border:2.5px solid var(--edu-midnight);border-radius:99px;padding:10px 22px}
.m-foot a:hover{background:var(--edu-midnight);color:var(--edu-white)}
.m-foot span{font-size:13px;color:var(--edu-light-grey)}

/* ---------- You and the real Jamestown ---------- */
.tallies{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.tallies li{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;background:var(--edu-white);border-radius:99px;box-shadow:var(--shadow-card);padding:5px 16px 5px 5px}
.sym{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;line-height:1;background:var(--tint-green)}
.part .sym,.sym.part{background:var(--tint-sun)}
.diff .sym,.sym.diff{background:var(--edu-white);border:2.5px solid var(--edu-midnight)}
.cmp-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.cmp{background:var(--edu-white);border-radius:16px;box-shadow:var(--shadow-card);padding:12px 16px 14px}
.cmp-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 12px;margin-bottom:8px}
.cmp-head b{font-family:var(--font-slab);font-weight:700;font-size:19px}
.cmp-head span{font-size:13px;font-weight:700;color:var(--edu-dark-grey)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.side{border-radius:12px;padding:8px 14px 10px;font-size:15px;line-height:1.4;border-left:6px solid var(--you);background:var(--tint-blue)}
.side.real{border-left-color:var(--real);background:var(--tint-pink)}
.side small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--edu-dark-grey)}
.pair .sym{align-self:center}
@media (max-width:520px){.pair{grid-template-columns:minmax(0,1fr)}.pair .sym{justify-self:center}}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:14px}
.barcard{background:var(--edu-white);border-radius:16px;box-shadow:var(--shadow-card);padding:14px 18px 18px}
.barcard h4{font-family:var(--font-slab);font-weight:700;font-size:20px;margin:0}
.barcard .sub{font-size:13.5px;color:var(--edu-light-grey)}
.barrow{margin-top:12px}
.barrow .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14.5px;margin-bottom:4px}
.barrow .who b{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.barrow .who b::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--you)}
.barrow.real .who b::before{background:var(--real)}
.barrow .who span{color:var(--edu-dark-grey);font-variant-numeric:tabular-nums;text-align:right}
.barrow .track{height:22px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.barrow .fill{height:100%;min-width:3px;border-radius:0 4px 4px 0;background:var(--you)}
.barrow.real .fill{background:var(--real)}
.barnote{font-size:13px;color:var(--edu-light-grey);margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body,body.is-welcome{background:#fff}
  .go,.advice,.copybox,.noprint{display:none!important}
  .wrap{max-width:none}
  .left{position:static}
  .modal{display:none!important}
  .status,.plate,.result,.cmp,.barcard,.verdicts li{box-shadow:none;border:1px solid var(--line)}
}

  var NEWS = {

  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

  function newState() {
    return { i: 0, food: START.food, health: START.health, trust: START.trust, company: START.company,
      settlers: START.settlers, sent: START.settlers, site: 'island', fields: false, log: [], lost: null,
      winter: null, firstYear: null, name: '' };
  }

  function seasonRate(s, weight) {
    var r = 0.01 + Math.max(0, 60 - s.health) * 0.006 + Math.max(0, 40 - s.food) * 0.006 + Math.max(0, 30 - s.trust) * 0.003;
    return r * weight;
  }

  /* Company approval nudges how much food each ship brings. */
  function companyBonus(s) { return clamp(Math.round((s.company - 50) / 5), -8, 8); }

  function applyNews(s, idx) {
    var n = NEWS[idx];
    if (!n) return null;
    var bonus = companyBonus(s);
    var before = s.settlers;
    var out = { head: n.head, text: n.text(s), bonus: bonus, arrived: n.settlers };
    s.settlers += n.settlers; s.sent += n.settlers;
    s.food = clamp(s.food + n.food + bonus, 0, 100);
    s.health = clamp(s.health + n.health, 0, 100);
    out.before = before;
    if (idx === 5) s.firstYear = before;
    return out;
  }

  function choose(s, key) {
    var round = ROUNDS[s.i];
    var c = null;
    for (var k = 0; k < round.choices.length; k++) if (round.choices[k].key === key) c = round.choices[k];
    if (c.flag) c.flag(s);
    var fx = c.fx(s), deltas = {};
    ['food', 'health', 'trust', 'company'].forEach(function (m) {
      var d = fx[m] || 0, was = s[m];
      s[m] = clamp(s[m] + d, 0, 100);
      if (s[m] !== was) deltas[m] = s[m] - was;
    });
    var deaths = Math.min(s.settlers, (c.extra || 0) + Math.round(s.settlers * seasonRate(s, round.weight)));
    s.settlers -= deaths;
    /* The simulation ends when nobody is left. An empty storehouse or a colony with no
       health left kills everyone who remains. After 1610, supply ships keep food from hitting bottom. */
    var cause = null;
    if (s.food <= 0 && s.i < 9) cause = 'food';
    else if (s.health <= 0) cause = 'health';
    else if (s.settlers <= 0) cause = 'dead';
    if (cause) { deaths += s.settlers; s.settlers = 0; s.lost = cause; if (s.i < 5) s.firstYear = 0; }
    var entry = { round: s.i, key: key, label: c.label, deaths: deaths, deltas: deltas, text: c.result(s), gaveUp: c.gaveUp };
    s.log.push(entry);
    return entry;
  }

  function winterRate(s) {
    return clamp(1.25 - 0.009 * s.food - 0.004 * s.trust - (s.fields ? 0.08 : 0), 0.06, 1);
  }

  function runWinter(s) {
    var rate = winterRate(s);
    var before = s.settlers;
    var deaths = Math.round(before * rate);
    s.settlers -= deaths;
    s.food = clamp(s.food - 20, 0, 100);
    s.winter = { before: before, after: s.settlers, deaths: deaths, rate: rate };
    if (s.settlers <= 0) s.lost = 'winter';
    return s.winter;
  }

  function verdicts(s) {
    var n = s.winter ? s.winter.after : s.settlers;
    if (s.lost) return { n: 0,
      people: 'None of your settlers lived. In the real colony, about 60 people held on.',
      peace: 'The Powhatan are still here. This is their country, as it was before your ships came.',
      profit: 'The Company has lost every person and every coin it sent.' };
    var people = n >= 300 ? 'Most of your people lived. Very few leaders in early Virginia could say that.'
      : n >= 150 ? 'You lost many people, but far fewer than the real colony did.'
      : n >= 61 ? 'It was close. A little more went right for you than for the real colony.'
      : 'Your colony suffered as much as the real one, or more.';
    var peace = s.trust >= 65 ? 'The Powhatan still trade with you and trust your word. That is rare, and it is worth a lot.'
      : s.trust >= 35 ? 'There is an uneasy peace. One bad choice could break it.'
      : 'Your neighbors have every reason to want you gone. War is coming.';
    var profit = s.company >= 70 ? 'The investors are delighted. Ships and settlers keep coming.'
      : s.company >= 40 ? 'The investors are still waiting for their money, but they have not given up on you.'
      : 'The investors are close to shutting the colony down.';
    return { people: people, peace: peace, profit: profit, n: n };
  }

  function headline(s) {
    if (s.lost) return 'Your colony did not survive';
    var n = s.winter.after;
    if (n >= 300) return 'Your colony is growing strong';
    if (n >= 150) return 'Your colony made it';
    if (n >= 61) return 'Your colony barely made it';

  function reportText(s) {

    if (s.name) lines.push('Leader: ' + s.name);
    lines.push(headline(s));
    if (s.lost) lines.push('Every settler died. The simulation ended at decision ' + s.log.length + ' of 10.');
    lines.push('Settlers alive: ' + s.settlers + ' of ' + s.sent + ' sent. (Real Jamestown, spring 1610: about 60 of about 500.)');
    lines.push('Food ' + s.food + ', Health ' + s.health + ', Trust ' + s.trust + ', Company ' + s.company + ' (each out of 100)');
    lines.push('');
    lines.push('My decisions:');
    s.log.forEach(function (e) {
      var r = ROUNDS[e.round];
      lines.push((e.round + 1) + '. ' + r.title + ' (' + r.when + '): ' + e.label + '. In real life: ' + r.realShort + '.');

    lines.push('');
    lines.push('People: ' + v.people);
    lines.push('Peace: ' + v.peace);
    lines.push('Profit: ' + v.profit);

  };
  function overBox() {
    return '<div class="over"><b>No one is left alive.</b><p>' + OVER[s.lost] + ' The simulation ends here.</p></div>';
  }

  function showResult(e) {
    var r = VV.ROUNDS[e.round];
    renderStatus();
    var nextLabel = s.lost ? 'See your report' : e.round === 8 ? 'Face the Starving Time' : e.round === 9 ? 'Read your report' : 'Next decision';
    show(
      '<div class="result">' +
      '<h2 class="round-title">You chose: ' + e.label + '</h2>' +
      '<p>' + e.text + '</p>' + chips(e) + (s.lost ? overBox() : '') +
      '<p class="gave"><b>What you gave up:</b> ' + e.gaveUp + '</p>' +
      '<div class="real"><h3>What really happened</h3><p>' + r.reality + '</p>' +
      (r.sources.length ? '<div class="evidence"><b>See the real evidence:</b>' + srcButtons(r.sources) + '</div>' : '') + '</div>' +
      '<p class="word"><b>Word to know: ' + r.word + '.</b> It means ' + VV.WORDS[r.word] + '. ' + r.wordNote + '</p>' +
      '<button class="go" id="next" type="button">' + nextLabel + '</button>' +
      '</div>');
    $('next').addEventListener('click', function () {
      if (s.lost) return showReport();
      if (e.round === 8) return showWinter();
      s.i = e.round + 1;
      if (s.i >= VV.ROUNDS.length) return showReport();
      showRound();
    });
  }

  /* ---------- the winter ---------- */
  function showWinter() {
    var w = VV.runWinter(s);
    renderStatus(); setWhen('Winter 1609 to 1610'); setPhoto(PIC.burial);
    var story = s.lost
      ? 'The food is gone before the first snow melts, and no town will trade with you. One by one, the settlers die. When spring comes, the fort is silent.'
      : w.rate >= 0.6
      ? 'It is the worst winter the colony has ever known. The food runs out. People eat the horses, then the dogs and cats, then rats, and at last their own leather shoes. By spring, the fort is nearly silent.'
      : w.rate >= 0.25
        ? 'It is a long, hungry winter. The food you stored runs low by February. Many people do not live to see the spring, but the colony holds together.'
        : 'It is a cold, lean winter, but your storehouse holds out. There is sickness, and there are burials. When the ice melts, most of your people are still here.';
    show(
      '<div class="result">' +
      '<span class="kicker">Winter 1609 to 1610</span><h2 class="round-title">The Starving Time</h2>' +
      '<p>' + story + '</p>' +
      '<div class="bignum"><div><b>' + w.before + '</b><span>people in the fall</span></div><div><b>' + w.after + '</b><span>alive in the spring</span></div></div>' + (s.lost ? overBox() : '') +
      '<div class="real"><h3>What really happened</h3><p>The real settlers called this winter the Starving Time. About 500 people went into it. About 60 came out. In June 1610 the survivors gave up, boarded their ships, and sailed away. Before they reached the ocean, they met a fleet coming in with new settlers and a year of supplies. They turned around.</p></div>' +
      '<button class="go" id="next" type="button">' + (s.lost ? 'See your report' : 'Keep going') + '</button>' +
      '</div>');
    $('next').addEventListener('click', function () {
      if (s.lost) return showReport();
      s.i = 9; showRound();
    });
  }

  /* ---------- the report ---------- */
  function barRow(cls, who, d) {
    var pct = Math.round(100 * d.alive / d.of), a = d.about ? 'about ' : '';
    var text = a + d.alive + ' of ' + a + d.of + ' lived (' + pct + '%)';
    return '<div class="barrow ' + cls + '"><div class="who"><b>' + who + '</b><span>' + text + '</span></div>' +
      '<div class="track" title="' + who + ': ' + text + '"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }
  function showReport() {
    renderStatus();
    var v = VV.verdicts(s), head = VV.headline(s), lost = !!s.lost, t = VV.tally(s), surv = VV.survival(s);
    document.body.classList.add('is-report');
    setWhen(lost ? 'The end' : 'Looking back');
    setPhoto(lost ? PIC.burial : PIC.gates);
    var why = lost
      ? OVER[s.lost] + ' The simulation ended at decision ' + s.log.length + ' of 10. When the next ship from England arrives, it will find an empty fort. People will call it another lost colony, like Roanoke.'
      : '';
    var cards = s.log.map(function (e) {
      var r = VV.ROUNDS[e.round], k = VV.matchKind(e.round, e.key);
      return '<li class="cmp ' + k + '" data-real="' + e.round + '" role="button" tabindex="0" aria-label="' + esc(r.title) + ': see what really happened"><div class="cmp-head"><b>' + (e.round + 1) + '. ' + r.title + '</b><span>' + SYM_WORDS[k] + '</span></div>' +
        '<div class="pair"><div class="side you"><small>You</small>' + e.label + '</div>' +
        '<span class="sym" aria-hidden="true">' + SYM[k] + '</span>' +
        '<div class="side real"><small>The real settlers</small>' + r.realShort + '</div></div>' +
        '<span class="cmp-more">What really happened? Click to find out</span></li>';
    }).join('');
    var bars = surv.map(function (p) {
      return '<div class="barcard"><h4>' + p.title + '</h4><p class="sub">' + p.sub + '</p>' +
        barRow('you', 'Your colony', p.you) + barRow('real', 'Real Jamestown', p.real) + '</div>';
    }).join('');
    var library = VV.LIBRARY.map(function (g) {
      return '<div><h4>' + g.name + '</h4>' + srcButtons(g.ids.map(function (id) { return VV.SOURCES[id]; })) + '</div>';
    }).join('');
    var html =
      '<span class="kicker">Final report</span><h2 class="report-head">' + head + '</h2>' +
      '<p class="lede">Report to the Virginia Company' + (s.name ? ', from ' + esc(s.name) : '') + '</p>' +
      (why ? '<div class="prose"><p>' + why + '</p></div>' : '') +
      '<ul class="verdicts"><li><b>People</b>' + v.people + '</li><li><b>Peace</b>' + v.peace + '</li><li><b>Profit</b>' + v.profit + '</li></ul>' +
      (bars ? '<h3 class="section">How many people lived</h3><div class="bars">' + bars + '</div><p class="barnote">Each bar shows the share of people who lived. A longer bar is better.</p>' : '') +
      '<h3 class="section">Your choices next to theirs</h3>' +
      '<p class="fine">Click any decision to see what really happened. Watch for decision 9: it led to the Starving Time.</p>' +
      '<ul class="tallies">' +
      '<li><span class="sym same" aria-hidden="true">=</span>' + t.same + ' the same</li>' +
      '<li><span class="sym part" aria-hidden="true">≈</span>' + t.part + ' partly the same</li>' +
      '<li><span class="sym diff" aria-hidden="true">≠</span>' + t.diff + ' different</li></ul>' +
      '<ul class="cmp-list">' + cards + '</ul>' +
      '<h3 class="section">Think it over</h3>' +
      '<ol class="think">' +
      '<li>Which of your decisions helped the colony most? What was its opportunity cost?</li>' +
      '<li>Look at the bars. Where did your colony do better or worse than the real one? Which decision made the difference?</li>' +
      '<li>Find one place where you chose collaboration and one place where you chose conflict. What happened to Trust each time?</li>' +
      '<li>Pick one decision where the real settlers chose differently than you did. Why do you think they made that choice?</li>' +
      '</ol>' +
      '<h3 class="section">What happened next in real life</h3>' +
      '<ul class="timeline">' +
      '<li><b>1613</b><span>The English kidnap Pocahontas, a daughter of Wahunsenacawh, and hold her for ransom.</span></li>' +
      '<li><b>1614</b><span>Pocahontas marries John Rolfe. The marriage brings several years of peace.</span></li>' +
      '<li><b>1617</b><span>Pocahontas dies in England at about age 21.</span></li>' +
      '<li><b>1619</b><span>Virginia holds its first elected assembly. That same summer, a ship brings about 20 enslaved Africans to the colony.</span></li>' +
      '<li><b>1620</b><span>Far to the north, the Pilgrims land at Plymouth. They came for a very different reason.</span></li>' +
      '<li><b>1622</b><span>Opechancanough leads an attack that kills about a quarter of the English settlers. Years of war follow.</span></li>' +
      '</ul>' +
      '<h3 class="section">See the real evidence</h3>' +
      '<p class="fine">English settlers wrote most of these 400 years ago. The spelling looks strange, so try reading it out loud. Some of their words for Powhatan people are unfair. Always ask who is telling the story.</p>' +
      '<div class="library">' + library + '</div>' +
      '<div class="row noprint"><button class="go" id="copy" type="button">Copy my report</button><button class="go quiet" id="again" type="button">Play again</button><span class="copied" id="copied" role="status"></span></div>' +
      '<div id="copyfallback"></div>';
    show(html);
    stage.querySelectorAll('[data-real]').forEach(function (li) {
      var go = function () { openModal(realHtml(+li.getAttribute('data-real')), li); };
      li.addEventListener('click', go);
      li.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    });
    $('again').addEventListener('click', showTitle);
    $('copy').addEventListener('click', function () {
      var text = VV.reportText(s);
      function fallback() {
        $('copyfallback').innerHTML = '<label for="copytext" class="fine">Select all of this text and copy it.</label><textarea class="copybox" id="copytext" readonly></textarea>';
        var box = $('copytext'); box.value = text; box.focus(); box.select();
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { $('copied').textContent = 'Copied. Paste it into a doc.'; }, fallback);
        } else { fallback(); }
      } catch (err) { fallback(); }
    });
  }

  showTitle();
})();

</script>
</body>
</html>
